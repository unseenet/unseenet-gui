name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # main is built against the core's main, as the development builds are
      # (unseenet-portable); a release names the core release it needs in pyproject.toml
      - run: pip install "unseenet[api] @ git+https://github.com/unseenet/unseenet@main"
      - run: pip install . pytest pytest-asyncio playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
        env:
          SHOTS: shots                     # every screen x size x theme, for the gallery (#264)
      - run: for f in src/unseenet_gui/static/*.js; do node --check "$f" || exit 1; done   # every script (#152)
      # every screen and dialog, phone beside desktop, to check both are the same app (#264)
      - if: always()
        run: python tools/gallery.py shots gallery.html dark && python tools/gallery.py shots gallery-light.html light
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery*.html
          if-no-files-found: ignore

  docs:
    # docs/ checked strictly, as unseenet-docs gathers it into unseenet.org
    uses: unseenet/.github/.github/workflows/docs-check.yml@main
