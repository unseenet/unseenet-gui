name: build
# Portable builds with Tor inside (Linux, Windows, macOS), one all-in-one USB
# zip, and the bootable graphical image - each self-tested. Like unseenet's own
# portable workflow, and using its Tor handling: Tor is downloaded and its
# OpenPGP signature checked by unseenet's tools/build_portable.py.
#
# On version tags the files are attached to the release. Not on every merge
# (#128, like unseenet#544): each night the "dev" pre-release is rebuilt, but
# only when this repo's main or the core's main changed since the last one; by
# hand, publish to "dev" (main only) or as workflow artifacts, and "force".
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "37 3 * * *"          # after the core's nightly build (03:17)
  pull_request:
    paths:
      - "tools/**"
      - "src/unseenet_gui/boot.py"
      - "src/unseenet_gui/selftest.py"
      - "src/unseenet_gui/winfix.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "dev = replace the dev pre-release (main only); artifact = workflow artifacts only"
        type: choice
        options: [dev, artifact]
        default: dev
      force:
        description: "Build even if nothing changed since the current dev build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The unseenet core these builds are made with: a release (vX.Y.Z) is built with
  # the core release named here (keep it within the range pyproject.toml asks for);
  # main, pull requests and dev builds with the core's main, to find breakage early.
  CORE_RELEASE: v0.5.0

jobs:
  gate:
    # Which core to build with (a fixed commit, so every job uses the same one),
    # and - nightly and by hand on main - whether anything changed since the
    # dev build: this repo's main or the core's main. Everything waits for this.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      core_ref: ${{ steps.check.outputs.core_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "core_ref=$CORE_RELEASE" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CORE=$(git ls-remote https://github.com/unseenet/unseenet refs/heads/main | cut -f1)
          echo "core_ref=$CORE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ] || [ "$FORCE" = true ] \
             || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DEV=$(git ls-remote origin refs/tags/dev | cut -f1)
          LAST_CORE=$(gh release view dev --json body -q .body 2>/dev/null | sed -n 's/.*core \([0-9a-f]\{40\}\).*/\1/p' | head -1)
          if [ -n "$DEV" ] && git cat-file -e "$DEV^{commit}" 2>/dev/null \
             && git diff --quiet "$DEV" HEAD -- src tools pyproject.toml .github/workflows/build.yml \
             && [ "$LAST_CORE" = "$CORE" ]; then
            echo "Nothing changed since the dev build (gui $DEV, core $CORE): skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  tor:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unseenet/unseenet
          ref: ${{ needs.gate.outputs.core_ref }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >
          python tools/build_portable.py --core core --out tor
          --fetch-tor linux-x86_64 windows-x86_64 macos-aarch64 macos-x86_64
      - run: cp core/tools/tor-version.txt tor/
      - uses: actions/upload-artifact@v4
        with:
          name: tor-bundles
          path: tor/

  portable:
    needs: [gate, tor]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-22.04}
          - {platform: windows-x86_64, runner: windows-latest}
          - {platform: macos-aarch64, runner: macos-latest}
          - {platform: macos-x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unseenet/unseenet
          ref: ${{ needs.gate.outputs.core_ref }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Development version (not on release tags)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: sed -i.bak "s/^__version__ = \"\(.*\)\.dev0\"/__version__ = \"\1.dev${{ github.run_number }}\"/" src/unseenet_gui/__init__.py
      - name: Key ripening on Intel Macs (chiavdf has no wheel there)
        if: matrix.platform == 'macos-x86_64'
        shell: bash
        # from source, as in unseenet's builds; the self-test proves it works (UN-RFC 0025)
        run: |
          brew install gmp cmake
          BUILD_VDF_CLIENT=N pip install --no-binary chiavdf "chiavdf>=1.1"
      - name: Install
        shell: bash
        run: |
          pip install ./core aiohttp pyinstaller pillow
          case "${{ matrix.platform }}" in linux-*) ;; *) pip install pywebview ;; esac
          pip install --no-deps .
      - uses: actions/download-artifact@v4
        with:
          name: tor-bundles
          path: tor
      - name: Build
        shell: bash
        run: >
          python tools/build_portable.py --core core --platform ${{ matrix.platform }} --out dist
          --tor-archive tor/tor-expert-bundle-${{ matrix.platform }}-$(cat tor/tor-version.txt).tar.gz
      - name: Unpack as a user would
        shell: bash
        run: |
          mkdir try && cd try && python -c "import importlib.util as u; s=u.spec_from_file_location('b','../core/tools/build_portable.py'); b=u.module_from_spec(s); s.loader.exec_module(b); from pathlib import Path; b.extract_zip(next(Path('../dist').glob('*.zip')), Path('.'))"
      - name: Self-test, offline (the program, its server and Tor start)
        shell: bash
        working-directory: try/Unseenet
        run: |
          # Windows: a windowed program without a console, so it writes to a log
          case "${{ matrix.platform }}" in
            windows-*) EXE="./Unseenet Graphical.exe" ;;
            *) EXE="./gui-${{ matrix.platform }}/unseenet-gui" ;;
          esac
          rc=0; "$EXE" --self-test --offline --log selftest.txt || rc=$?
          cat selftest.txt; exit $rc
      - name: Self-test over the Tor network
        continue-on-error: true            # the runner's network may not reach Tor
        timeout-minutes: 5
        shell: bash
        working-directory: try/Unseenet
        run: |
          case "${{ matrix.platform }}" in
            windows-*) EXE="./Unseenet Graphical.exe" ;;
            *) EXE="./gui-${{ matrix.platform }}/unseenet-gui" ;;
          esac
          rc=0; "$EXE" --self-test --log selftest.txt \
            --node f6vnchi5p7ll4yn6yot6cz4ohzuxy3uhc3kztafuwn3zlyoup6tn64qd.onion || rc=$?
          cat selftest.txt; exit $rc
      - name: No console window on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        working-directory: try/Unseenet
        run: |
          # PE subsystem 2 = Windows GUI (3 would be a console program)
          $b = [IO.File]::ReadAllBytes("Unseenet Graphical.exe"); $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 0x5C); "subsystem $sub"; if ($sub -ne 2) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: unseenet-gui-${{ matrix.platform }}
          path: dist/*.zip
          compression-level: 0

  usb:
    needs: [gate, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unseenet/unseenet
          ref: ${{ needs.gate.outputs.core_ref }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Development version (not on release tags)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: sed -i "s/^__version__ = \"\(.*\)\.dev0\"/__version__ = \"\1.dev${{ github.run_number }}\"/" src/unseenet_gui/__init__.py
      - uses: actions/download-artifact@v4
        with:
          pattern: unseenet-gui-*
          path: zips
          merge-multiple: true
      - run: python tools/build_portable.py --core core --combine zips/*.zip --out zips
      - uses: actions/upload-artifact@v4
        with:
          name: unseenet-gui-usb
          path: zips/*-usb.zip
          compression-level: 0

  image:
    # Alpine from RAM with the client full screen; booted in QEMU (BIOS and
    # UEFI), where its self-test must pass: the page loads in the kiosk, Tor connects.
    needs: [gate, usb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unseenet/unseenet
          ref: ${{ needs.gate.outputs.core_ref }}
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: unseenet-gui-usb
          path: usb
      - name: Build
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/unseenet_gui/__init__.py)
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="${VERSION%.dev0}.dev${{ github.run_number }}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION=$VERSION sh tools/image/build.sh core usb/*-usb.zip
      - name: Boot it in QEMU (BIOS and UEFI) and run its self-test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf mtools >/dev/null
          sudo chmod a+rw /dev/kvm 2>/dev/null || true
          sudo chown -R "$(id -u)" dist
          IMG=dist/image/unseenet-gui-$VERSION-x86_64.img
          TIMEOUT=1200 sh tools/image/boot-test.sh "$IMG" bios
          TIMEOUT=1200 sh tools/image/boot-test.sh "$IMG" uefi
      - name: The splash, the self-test's screenshots and the boot logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-checks
          path: |
            dist/image/splash.png
            dist/image/selftest-screen-*.png
            dist/image/boot-test-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: unseenet-gui-image
          path: dist/image/unseenet-gui-*.img.xz
          compression-level: 0

  release:
    needs: [gate, usb, image]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == 'dev')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unseenet-gui-*
          path: files
          merge-multiple: true
      - name: Checksums
        run: |
          cd files && rm -f splash.png selftest-screen-*.png boot-test-*.log
          sha256sum *.zip *.img.xz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release (tags) or the dev pre-release (main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            # release.yml makes the release with the CHANGELOG notes (and PyPI); add the builds
            for i in $(seq 1 40); do
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 30
            done
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            gh release delete dev --yes --cleanup-tag 2>/dev/null || true
            gh release create dev files/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Development build" \
              --notes "The newest code on main, built and self-tested automatically each night when something changed. Built from gui $GITHUB_SHA, core ${{ needs.gate.outputs.core_ref }}. Not a release. Pre-alpha: not security reviewed."
          fi
